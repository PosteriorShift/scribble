<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Lobby — Scribble</title>
<style>
  :root{ --bg:#0f172a; --panel:#1e293b; --accent:#38bdf8; --text:#e2e8f0; --muted:#94a3b8; --ok:#22c55e; --danger:#ef4444;}
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;min-height:100dvh;}
  body{background:radial-gradient(circle at top,#1e293b,#0f172a 60%); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; padding:16px;}
  .wrap{max-width:640px; margin:0 auto;}
  header{display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; gap:12px;}
  h1{font-size:22px; margin:0;}
  .code{font-size:26px; font-weight:800; letter-spacing:4px; color:var(--accent);}
  .copy{font-size:12px; color:var(--muted); cursor:pointer; text-decoration:underline; text-align:right;}
  .panel{background:var(--panel); border-radius:16px; padding:16px; margin-bottom:14px; box-shadow:0 10px 30px rgba(0,0,0,.4);}
  .panel h2{font-size:13px; text-transform:uppercase; letter-spacing:1px; color:var(--muted); margin:0 0 10px;}
  ul{list-style:none; margin:0; padding:0;}
  li{display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid #334155;}
  li:last-child{border-bottom:none;}
  .dot{width:10px;height:10px;border-radius:50%; background:var(--ok); flex:0 0 auto;}
  .dot.off{background:var(--danger);}
  .name{flex:1; font-weight:600;}
  .host{font-size:11px; background:var(--accent); color:#0f172a; padding:2px 8px; border-radius:20px; font-weight:700;}
  .you{color:var(--muted); font-size:12px;}
  button{width:100%; padding:15px; border-radius:12px; border:none; font-size:16px; font-weight:700; cursor:pointer; background:var(--accent); color:#0f172a; margin-top:6px;}
  button:disabled{opacity:.5; cursor:not-allowed;}
  button.secondary{background:transparent; border:1px solid var(--accent); color:var(--accent);}
  .status{font-size:13px; color:var(--muted); text-align:center; margin-top:8px;}
  .mic-row{display:flex; align-items:center; gap:10px; margin-top:8px; font-size:13px; color:var(--muted);}
  .mic-row input{width:auto;}
  .rounds-row{display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
  .rounds-row .lbl{color:var(--muted); font-size:13px;}
  .chips{display:flex; gap:6px;}
  .chip{
    width:auto; padding:8px 16px; border-radius:10px;
    background:#0f172a; color:var(--text);
    border:1px solid #334155; font-weight:700;
    cursor:pointer; font-size:14px; margin-top:0;
  }
  .chip.active{background:var(--accent); color:#0f172a; border-color:var(--accent);}
  .chip:disabled{opacity:.5; cursor:not-allowed;}
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Scrib<span style="color:var(--accent)">ble</span> Lobby</h1>
      <div>
        <div class="code" id="roomCode">----</div>
        <div class="copy" id="copyCode">tap to copy</div>
      </div>
    </header>

    <div class="panel">
      <h2>Players (<span id="count">0</span>/10)</h2>
      <ul id="players"></ul>
    </div>

    <div class="panel">
      <h2>Game settings</h2>
      <div class="rounds-row">
        <span class="lbl">Rounds:</span>
        <div class="chips" id="roundChips">
          <button class="chip" data-rounds="3">3</button>
          <button class="chip" data-rounds="5">5</button>
          <button class="chip" data-rounds="7">7</button>
        </div>
      </div>
      <div class="status" id="roundHint">Host selects. Each player draws once per round.</div>
    </div>

    <div class="panel">
      <h2>Voice chat</h2>
      <div class="mic-row">
        <input type="checkbox" id="micToggle" />
        <label for="micToggle" style="margin:0; color:var(--text);">Enable microphone</label>
      </div>
      <div class="status" id="voiceStatus">Voice is optional.</div>
    </div>

    <button id="startBtn" disabled>Waiting for host…</button>
    <div class="status" id="status">Connecting…</div>
  </div>

<script src="/static/voice.js"></script>
<script>
const $ = (id)=>document.getElementById(id);
const params = new URLSearchParams(location.search);
const roomCode = (params.get('room') || '').toUpperCase();
const name = sessionStorage.getItem('scribble_name') || '';
let playerId = localStorage.getItem('scribble_pid');

if(!roomCode || !name){ alert('Missing name or room.'); location.href='/'; }

$('roomCode').textContent = roomCode;
$('copyCode').addEventListener('click', async ()=>{
  try{ await navigator.clipboard.writeText(roomCode); $('copyCode').textContent='copied!';
    setTimeout(()=>$('copyCode').textContent='tap to copy',1500);
  }catch(e){}
});

if(!playerId){
  playerId = 'p_' + Math.random().toString(36).slice(2,10) + Date.now().toString(36);
  localStorage.setItem('scribble_pid', playerId);
}

const proto = location.protocol === 'https:' ? 'wss' : 'ws';
const wsUrl = `${proto}://${location.host}/ws/${roomCode}/${playerId}`;
let ws;
let currentHostId = null;
let lastPlayers = [];
let selectedRounds = 3;

/* ---------- Voice ---------- */
let voice = null;
function initVoice(){
  voice = new Voice({
    ws,
    myId: playerId,
    send: (m)=>{ if(ws && ws.readyState===1) ws.send(JSON.stringify(m)); },
    onStatus: (s, info)=>{
      const el = $('voiceStatus');
      if(s === 'denied') el.textContent = 'Microphone permission denied.';
      else if(s === 'on'){
        const { connected=0, total=0 } = info || {};
        el.textContent = `🎙 Live — connected to ${connected}/${Math.max(0,total-1)} peers`;
      } else el.textContent = 'Voice off.';
    },
    onActivity: ()=>{},
  });
}

function setStatus(s){ $('status').textContent = s; }

function connect(){
  ws = new WebSocket(wsUrl);
  ws.addEventListener('open', ()=>{
    setStatus('Connected');
    ws.send(JSON.stringify({type:'join', name}));
    if(!voice) initVoice();
    else voice.ws = ws;
  });
  ws.addEventListener('close', ()=>{
    setStatus('Disconnected — reconnecting…');
    setTimeout(connect, 1500);
  });
  ws.addEventListener('message', (ev)=>{
    let msg; try{ msg = JSON.parse(ev.data); }catch(e){ return; }
    handle(msg);
  });
}

function renderPlayers(players, hostId){
  currentHostId = hostId;
  lastPlayers = players;
  $('count').textContent = players.length;
  const ul = $('players'); ul.innerHTML = '';
  players.forEach(p=>{
    const li = document.createElement('li');
    const speaking = p._speaking ? ' 🗣️' : '';
    li.innerHTML = `<span class="dot ${p.connected?'':'off'}"></span>
      <span class="name">${escapeHtml(p.name)}${speaking}</span>
      ${p.id === playerId ? '<span class="you">you</span>' : ''}
      ${p.is_host ? '<span class="host">HOST</span>' : ''}`;
    ul.appendChild(li);
  });
  const startBtn = $('startBtn');
  const isHost = hostId === playerId;
  if(isHost){
    startBtn.disabled = players.length < 2;
    startBtn.textContent = players.length < 2
      ? 'Need 2+ players'
      : `Start Game (${players.length} players)`;
  }else{
    startBtn.disabled = true;
    startBtn.textContent = 'Waiting for host…';
  }
  refreshRoundChips();
  if(voice) voice.setPeers(players);
}

function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ---------- Rounds picker ---------- */
const roundChips = document.querySelectorAll('#roundChips .chip');
function refreshRoundChips(){
  const isHost = currentHostId === playerId;
  roundChips.forEach(ch => {
    ch.disabled = !isHost;
    ch.classList.toggle('active', parseInt(ch.dataset.rounds,10) === selectedRounds);
  });
  $('roundHint').textContent = isHost
    ? 'You are the host — pick rounds, then start.'
    : `Host picked ${selectedRounds} rounds.`;
}
roundChips.forEach(ch => {
  ch.addEventListener('click', () => {
    if(currentHostId !== playerId) return;
    selectedRounds = parseInt(ch.dataset.rounds, 10);
    refreshRoundChips();
    if(ws && ws.readyState === 1) ws.send(JSON.stringify({type:'set_rounds', rounds:selectedRounds}));
  });
});

function handle(msg){
  switch(msg.type){
    case 'welcome':
      setStatus('In room ' + msg.room);
      break;
    case 'welcome_back':
      setStatus('Reconnected');
      break;
    case 'room_state':
      if(typeof msg.total_rounds === 'number') selectedRounds = msg.total_rounds;
      renderPlayers(msg.players, msg.host_id);
      break;
    case 'voice_signal':
      if(voice) voice.handleSignal(msg.from, msg.signal);
      break;
    case 'voice_activity': {
      const p = lastPlayers.find(x=>x.id===msg.player_id);
      if(p){ p._speaking = msg.speaking; renderPlayers(lastPlayers, currentHostId); }
      break;
    }
    case 'error':
      setStatus('⚠ ' + msg.message);
      break;
    case 'game_starting':
      setStatus('Starting game…');
      sessionStorage.setItem('scribble_player_id', playerId);
      if(voice && voice.enabled) sessionStorage.setItem('scribble_mic', '1');
      setTimeout(()=>{ location.href = '/game?room=' + roomCode; }, 400);
      break;
  }
}

$('startBtn').addEventListener('click', ()=>{
  if(ws && ws.readyState === 1)
    ws.send(JSON.stringify({type:'start_game', rounds: selectedRounds}));
});

/* ---------- Mic toggle ---------- */
const micToggle = $('micToggle');
micToggle.addEventListener('change', async (e)=>{
  if(!voice) initVoice();
  if(e.target.checked){
    const ok = await voice.enable();
    if(!ok) e.target.checked = false;
  } else {
    voice.disable();
  }
});

if(sessionStorage.getItem('scribble_mic') === '1'){
  micToggle.checked = true;
  const wait = setInterval(()=>{
    if(voice){ clearInterval(wait); voice.enable(); }
  }, 100);
}

connect();
refreshRoundChips();
</script>
</body>
</html>
