<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Scribble</title>
<style>
  :root{ --bg:#0f172a; --panel:#1e293b; --accent:#38bdf8; --text:#e2e8f0; --muted:#94a3b8; --ok:#22c55e; --danger:#ef4444;}
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:radial-gradient(circle at top,#1e293b,#0f172a 60%);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    display:flex; align-items:center; justify-content:center;
    min-height:100dvh; padding:16px;
  }
  .card{
    width:100%; max-width:420px; background:var(--panel);
    border-radius:20px; padding:24px; box-shadow:0 20px 50px rgba(0,0,0,.5);
  }
  h1{margin:0 0 6px; font-size:32px; text-align:center; letter-spacing:-0.5px;}
  h1 span{color:var(--accent);}
  .sub{color:var(--muted); text-align:center; font-size:13px; margin-bottom:20px;}
  label{display:block; font-size:13px; color:var(--muted); margin-bottom:6px; margin-top:12px;}
  input{
    width:100%; padding:14px; border-radius:12px; border:1px solid #334155;
    background:#0f172a; color:var(--text); font-size:16px; outline:none;
  }
  input:focus{border-color:var(--accent);}
  button{
    width:100%; padding:14px; border-radius:12px; border:none;
    font-size:16px; font-weight:600; cursor:pointer; margin-top:12px;
    background:var(--accent); color:#0f172a; transition:transform .08s;
  }
  button:active{transform:scale(.98);}
  button.secondary{background:transparent; color:var(--accent); border:1px solid var(--accent);}
  .row{display:flex; gap:10px;}
  .row button{flex:1;}
  .err{color:var(--danger); font-size:13px; text-align:center; margin-top:10px; min-height:18px;}
</style>
</head>
<body>
  <div class="card">
    <h1>Scrib<span>ble</span></h1>
    <div class="sub">Draw • Guess • Score</div>

    <label for="name">Your name</label>
    <input id="name" maxlength="20" placeholder="Enter name" autocomplete="off" />

    <button id="createBtn">Create Room</button>

    <label for="code">Or join with code</label>
    <div class="row">
      <input id="code" maxlength="4" placeholder="ABCD" style="text-transform:uppercase" autocomplete="off" />
      <button id="joinBtn" style="margin-top:0; max-width:120px;">Join</button>
    </div>

    <div class="err" id="err"></div>
  </div>

<script>
const $ = (id)=>document.getElementById(id);
function err(m){ $('err').textContent = m || ''; }

function pid(){
  let p = localStorage.getItem('scribble_pid');
  if(!p){
    p = 'p_' + Math.random().toString(36).slice(2,10) + Date.now().toString(36);
    localStorage.setItem('scribble_pid', p);
  }
  return p;
}

async function createRoom(){
  err('');
  const name = $('name').value.trim();
  if(!name){ err('Please enter a name'); return; }
  try{
    const r = await fetch('/api/create_room', {method:'POST'});
    if(!r.ok) throw new Error('Server error');
    const data = await r.json();
    sessionStorage.setItem('scribble_name', name);
    localStorage.setItem('scribble_pid', pid());
    window.location.href = '/lobby?room=' + data.code;
  }catch(e){ err('Could not create room'); }
}

function joinRoom(){
  err('');
  const name = $('name').value.trim();
  const code = $('code').value.trim().toUpperCase();
  if(!name){ err('Please enter a name'); return; }
  if(!code || code.length !== 4){ err('Enter a 4-char room code'); return; }
  sessionStorage.setItem('scribble_name', name);
  window.location.href = '/lobby?room=' + code;
}

$('createBtn').addEventListener('click', createRoom);
$('joinBtn').addEventListener('click', joinRoom);
$('code').addEventListener('input', e=>{ e.target.value = e.target.value.toUpperCase(); });
$('code').addEventListener('keydown', e=>{ if(e.key==='Enter') joinRoom(); });
$('name').addEventListener('keydown', e=>{ if(e.key==='Enter') createRoom(); });
</script>
</body>
</html>
